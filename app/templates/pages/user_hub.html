{% extends 'components/base.html' %} {% block title %}osu! - User Hub{% endblock
    %} {% block content %} {% block page_header %}
<div class="page-header">
    <div class="container">
        <h2>User Hub</h2>
    </div>
</div>
{% endblock %}
<div class="tabs-container">
    <div class="tabs">
        <button class="tab-button active" onclick="showTab('beatmaps')">Uploaded Beatmaps</button>
        <button class="tab-button" onclick="showTab('created_discussion')">Created Discussion</button>
        <form action="{{ url_for("user_hub.hide") }}"
              method="POST"
              class="toggle-form">
            <label class="toggle-switch" for="hide-uploader-toggle">
                <span class="toggle-label">Hide Uploader</span>
                <input type="checkbox"
                       id="hide-uploader-toggle"
                       name="hide_uploader"
                       value="1"
                       {% if current_user.uploader_h %}checked{% endif %}
                       onchange="this.form.submit()" />
                <span class="toggle-slider"></span>
            </label>
        </form>
    </div>
    <div id="beatmaps" class="tab-content" style="display: block">{% include "components/card.html" %}</div>
    <div id="created_discussion" class="tab-content" style="display: none">
        {% include "components/discussion_card.html" %}
    </div>
</div>
<script src="{{ url_for('static', filename='js/content_select.js') }}"></script>
{% endblock %}
